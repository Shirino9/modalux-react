
name: React Online Shop CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository kodini olish
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js o'rnatish
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Dependencies o'rnatish
      - name: Install Dependencies
        run: npm ci

      # 4. React application build qilish
      - name: Build Application
        run: npm run build

      # 5. Build natijasini saqlash
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-online-shop-build
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    # Faqat main branch push bo'lganda deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-online-shop-build
          path: dist/

      # Deploy bosqichini keyin hosting platformangizga moslaymiz
      - name: Deployment Information
        run: |
          echo "Build successful!"
          echo "Ready for deployment."
